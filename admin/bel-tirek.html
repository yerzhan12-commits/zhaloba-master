<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>БЕЛ-ТІРЕК — коды доступа</title>
<style>
  body{font-family:-apple-system,sans-serif;background:#0d0d0d;color:#fff;padding:16px;max-width:520px;margin:0 auto;}
  h1{font-size:18px;color:#7fc7b4;margin:24px 0 4px;}
  .sub{color:#898781;font-size:13px;margin-bottom:20px;}
  .card{background:#1a1a19;border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:16px;margin-bottom:16px;}
  label{display:block;font-size:12px;color:#898781;margin-bottom:4px;}
  input{width:100%;padding:11px 12px;border:1px solid rgba(255,255,255,0.1);border-radius:9px;
    font-size:14px;background:#111;color:#fff;margin-bottom:12px;box-sizing:border-box;}
  button{padding:11px 18px;border:none;border-radius:9px;background:#7fc7b4;color:#0d0d0f;
    font-size:14px;font-weight:700;cursor:pointer;}
  button:disabled{opacity:0.5;}
  button.ghost{background:none;border:1px solid rgba(255,255,255,0.15);color:#fff;font-weight:600;padding:7px 12px;font-size:12.5px;}
  .msg{font-size:13px;margin-top:10px;display:none;}
  .msg.err{color:#e66767;}
  .msg.ok{color:#8bb35e;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid rgba(255,255,255,0.08);}
  th{color:#898781;font-weight:600;font-size:11.5px;text-transform:uppercase;}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;}
  .dot.on{background:#8bb35e;}
  .dot.off{background:#898781;}
  .row-actions button{margin-right:6px;}
  .top-row{display:flex;justify-content:space-between;align-items:center;}
  .logout-btn{background:none;border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#c3c2b7;font-size:12px;padding:6px 12px;cursor:pointer;}
</style>
</head>
<body>
  <div class="top-row">
    <h1>БЕЛ-ТІРЕК — коды доступа</h1>
    <button type="button" class="logout-btn" id="logout-btn">Выйти</button>
  </div>
  <div class="sub">Один код активируется на первом устройстве, которое его ввело. Остальные попытки с других устройств отклоняются автоматически.</div>

  <div class="card">
    <label for="code">Код (латиницей/цифрами, без пробелов)</label>
    <input type="text" id="code" placeholder="Например ERZHAN" autocapitalize="characters">
    <label for="name">Имя владельца кода</label>
    <input type="text" id="name" placeholder="Например Ержан">
    <button type="button" id="add-btn">Выдать код</button>
    <div class="msg" id="add-msg"></div>
  </div>

  <div class="card">
    <div class="top-row" style="margin-bottom:10px;">
      <b style="font-size:14px;">Все коды</b>
      <button type="button" class="ghost" id="refresh-btn">Обновить</button>
    </div>
    <table id="codes-table">
      <thead><tr><th>Код</th><th>Имя</th><th>Статус</th><th></th></tr></thead>
      <tbody id="codes-body"><tr><td colspan="4" style="color:#898781;">Загрузка...</td></tr></tbody>
    </table>
  </div>

<script>
const ENDPOINT = '/api/bel-tirek/admin';

async function call(action, extra){
  const res = await fetch(ENDPOINT, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    credentials: 'include',
    body: JSON.stringify({action, ...extra})
  });
  if (res.status === 403){
    window.location.href = '/admin/login.html?next=' + encodeURIComponent('/admin/bel-tirek.html');
    throw new Error('redirecting');
  }
  return res.json();
}

function showMsg(el, text, ok){
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
  el.style.display = 'block';
}

async function loadCodes(){
  const body = document.getElementById('codes-body');
  body.innerHTML = '<tr><td colspan="4" style="color:#898781;">Загрузка...</td></tr>';
  try{
    const data = await call('list');
    if (!data.ok){ body.innerHTML = '<tr><td colspan="4">Ошибка загрузки</td></tr>'; return; }
    if (!data.codes.length){ body.innerHTML = '<tr><td colspan="4" style="color:#898781;">Пока нет ни одного кода.</td></tr>'; return; }
    body.innerHTML = data.codes.map(c => `
      <tr>
        <td>${c.code}</td>
        <td>${c.name}</td>
        <td><span class="dot ${c.active ? 'on' : 'off'}"></span>${c.active ? 'активирован' : 'ещё не использован'}</td>
        <td class="row-actions">${c.active ? `<button class="ghost" data-reset="${c.code}">Сбросить</button>` : ''}</td>
      </tr>
    `).join('');
    body.querySelectorAll('[data-reset]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        await call('reset', {code: btn.dataset.reset});
        loadCodes();
      });
    });
  }catch(e){ /* redirect already handled */ }
}

document.getElementById('add-btn').addEventListener('click', async () => {
  const code = document.getElementById('code').value.trim();
  const name = document.getElementById('name').value.trim();
  const msg = document.getElementById('add-msg');
  if (!code || !name){ showMsg(msg, 'Заполните код и имя.', false); return; }
  const btn = document.getElementById('add-btn');
  btn.disabled = true;
  try{
    const data = await call('add', {code, name});
    if (data.ok){
      showMsg(msg, `Код ${data.code} выдан для ${data.name}.`, true);
      document.getElementById('code').value = '';
      document.getElementById('name').value = '';
      loadCodes();
    } else {
      showMsg(msg, 'Не получилось: ' + data.error, false);
    }
  }catch(e){ /* redirect already handled */ }
  btn.disabled = false;
});

document.getElementById('refresh-btn').addEventListener('click', loadCodes);
document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/api/auth?action=logout', { method: 'POST' });
  window.location.href = '/admin/login.html';
});

loadCodes();
</script>
</body>
</html>
